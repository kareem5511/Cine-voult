name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-disabled: true

      - name: Prepare Environment & Keystore
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-configuration-cache --no-build-cache -Djava.awt.headless=true 2>&1 | tee gradle-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$GRADLE_EXIT" >> $GITHUB_ENV

      - name: Inspect Build Outputs
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" | tee apk_files.txt
          python3 -c '
          import os, re
          if os.path.exists("apk_files.txt"):
              with open("apk_files.txt") as f:
                  for line in f.read().splitlines():
                      if line.strip():
                          print(f"::notice title=DiscoveredAPK::{line.strip()}")
          if os.path.exists("gradle-build.log"):
              with open("gradle-build.log", errors="ignore") as f:
                  lines = f.readlines()
              # 1. Print all compiler errors (e: file:line:col error)
              errs = [l.strip() for l in lines if l.strip().startswith("e: ") or ": error:" in l or "unresolved reference" in l.lower()]
              for i, err in enumerate(errs[:15]):
                  print(f"::error title=Kotlinc::{err[:250]}")
              if not errs:
                  text = "".join(lines)
                  for ft in re.findall(r"> Task ([^\n]+ FAILED)", text):
                      print(f"::error title=FailedTask::{ft}")
                  if "* What went wrong:" in text:
                      section = text.split("* What went wrong:")[1].split("* Try:")[0].strip()
                      for l in section.splitlines()[:6]:
                          if l.strip():
                              print(f"::error title=WhatWentWrong::{l.strip()[:200]}")
          '
          if [ "$GRADLE_EXIT" != "0" ] && [ -n "$GRADLE_EXIT" ]; then
            echo "Failing step because Gradle exited with code $GRADLE_EXIT"
            exit $GRADLE_EXIT
          fi

      - name: Prepare APK Outputs
        if: success()
        run: |
          mkdir -p release_apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_apk/CineVault-debug.apk
            echo "Copied app-debug.apk to release_apk/CineVault-debug.apk"
          else
            FIRST_APK=$(find app/build/outputs -name "*.apk" | head -n 1)
            if [ -n "$FIRST_APK" ]; then
              cp "$FIRST_APK" release_apk/CineVault-debug.apk
              echo "Copied $FIRST_APK to release_apk/CineVault-debug.apk"
            fi
          fi
          ls -la release_apk/

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle-build.log
          retention-days: 7

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-Debug-APK
          path: release_apk/CineVault-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: CineVault Latest Debug Build
          body: |
            ### CineVault Debug APK
            Auto-built from commit `${{ github.sha }}`.

            **Direct APK Download**: [CineVault-debug.apk](https://github.com/kareem5511/Cine-voult/releases/download/latest/CineVault-debug.apk)
          files: release_apk/CineVault-debug.apk

      - name: Publish Build Summary
        if: always()
        run: |
          echo "## 🚀 CineVault Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f release_apk/CineVault-debug.apk ]; then
            SIZE=$(du -h release_apk/CineVault-debug.apk | cut -f1)
            echo "✅ **CineVault-debug.apk successfully built!** (Size: $SIZE)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📥 How to Download the APK" >> $GITHUB_STEP_SUMMARY
            echo "1. **Direct Release Download** (no login required): [Download CineVault-debug.apk](https://github.com/kareem5511/Cine-voult/releases/download/latest/CineVault-debug.apk)" >> $GITHUB_STEP_SUMMARY
            echo "2. **Actions Artifact** (scroll to the bottom of this run summary page): [CineVault-Debug-APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
          fi
